[env:esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags = 
  ; Serial = UART0 (the CH343 "UART" USB port of the DevKitC). With
  ; ARDUINO_USB_CDC_ON_BOOT=1, Serial would go to the native USB port instead
  ; and nothing would show on the UART monitor.
  -DARDUINO_USB_CDC_ON_BOOT=0
; Board is an ESP32-S3-DevKitC-1-N8 (no PSRAM). The SUM2033 driver only uses
; internal RAM, so do not enable PSRAM here.


lib_deps =
	https://github.com/mrcodetastic/GFX_Lite
  https://github.com/adafruit/Adafruit-GFX-Library.git
  gilmaimon/ArduinoWebsockets@^0.5.4

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
check_skip_packages = yes