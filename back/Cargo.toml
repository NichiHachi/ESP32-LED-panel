[package]
name = "esp-led-manager"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
futures-util = "0.3"
image = { version = "0.25", features = ["gif", "jpeg", "png", "webp"] }
multer = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zip = "4"
tower = "0.5.3"
config = "0.15.26"
